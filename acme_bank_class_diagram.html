<style>
#cd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#cd svg.classDiagram .row-rect-odd path,
#cd svg.classDiagram .row-rect-odd rect,
#cd svg.classDiagram .row-rect-even path,
#cd svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
  class User {
    -String username
    -String password
    -String userId
    -int failedAttempts
    +checkPassword(input) bool
    +isLocked() bool
    +registerFailedAttempt()
    +getRole()* String
  }
  class Customer {
    -CheckingAccount checkingAccount
    -SavingsAccount savingsAccount
    +getRole() String
  }
  class Banker {
    +getRole() String
  }
  class Account {
    -String accountNumber
    -double balance
    -boolean isActive
    -int overDraftCount
    -String customerId
    -ICard card
    +withDraw(amount)
    +deposit(amount)
    +getAccountType()* String
  }
  class CheckingAccount
  class SavingsAccount
  class Transactable {
    <<interface>>
    +withdraw(amount)
    +deposit(amount)
    +transfer(target, amount)
  }
  class ICard {
    <<interface>>
    +getWithdrawLimit() double
    +getTransferLimit() double
    +getOwnTransferLimit() double
    +getDepositLimit() double
    +getOwnDepositLimit() double
    +getCardType() String
  }
  class Mastercard
  class MastercardTitanium
  class MastercardPlatinum
  class Transaction {
    -String accountNumber
    -String type
    -double amount
    -double balanceAfter
    -LocalDateTime timestamp
  }
  class Bank {
    -List~User~ users
    -List~Account~ accounts
    -FileHandler fileHandler
    +login(username, password) User
    +addCustomer(...) Customer
    +withdraw(account, amount)
    +deposit(account, amount)
    +transfer(fromAcc, toAccNumber, amount)
    +getTransactionHistory(account) List
  }
  class FileHandler {
    +userListLoading() List~User~
    +saveUsers(users)
    +accountsListLoading() List~Account~
    +saveAccounts(accounts)
    +appendingTransactions(t)
  }
  class PasswordUtil {
    +hashFunction(password)$ String
  }

  User <|-- Customer
  User <|-- Banker
  Account <|-- CheckingAccount
  Account <|-- SavingsAccount
  Account ..|> Transactable
  ICard <|.. Mastercard
  ICard <|.. MastercardTitanium
  ICard <|.. MastercardPlatinum
  Customer "1" o-- "0..2" Account
  Account "1" *-- "1" ICard
  Bank "1" o-- "*" User
  Bank "1" o-- "*" Account
  Bank --> FileHandler
  Bank ..> Transaction
  User ..> PasswordUtil
`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#cd svg.classDiagram .row-rect-odd path, #cd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
